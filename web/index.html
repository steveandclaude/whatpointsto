<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>whatpointsto</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --bg: #0d1220;
    --panel: #141b2e;
    --panel-line: #26304a;
    --ink: #dfe6f5;
    --ink-soft: #8d99b8;
    --outcome: #f0b64b;
    --position: #6ba3ff;
    --standard: #b18cff;
    --fact: #3fd0b6;
    --accent: #ffd27f;
    --blue: #3d5afe;
    --good: #7dffb0;
    --bad: #ff9f9f;
    --promise: #d9c27a;
    --promise-bg: #241f10;
    --draft-ink: #e6c96a;
    --draft-bg: #221c08;
    --draft-line: #8a763a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden;
    line-height: 1.45;
  }

  header.top {
    padding: 8px 16px; font-size: 0.85rem; color: var(--ink-soft);
    border-bottom: 1px solid var(--panel-line);
    display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
  }
  header.top .brand { color: var(--ink); font-weight: 650; }
  header.top .brand span { color: var(--position); }
  header.top nav { margin-left: auto; display: flex; gap: 8px; }

  main { flex: 1; display: flex; min-height: 0; position: relative; }
  #scene { flex: 1; min-width: 0; }
  svg { width: 100%; height: 100%; display: block; cursor: default; }

  /* ---- scene nodes ---- */
  .node { cursor: pointer; }
  .node .shape { stroke: rgba(255,255,255,0.25); stroke-width: 1.5; }
  .node.outcome .shape { fill: var(--outcome); }
  .node.position .shape { fill: var(--position); }
  .node.position.standard .shape { fill: var(--standard); }
  .node.fact .shape { fill: var(--fact); }
  .node .name { fill: #c9d4ea; font-size: 12px; pointer-events: none; }
  .node.answered .shape { stroke: var(--good); stroke-width: 3; }
  .node.live .shape { filter: drop-shadow(0 0 7px rgba(63, 208, 182, 0.9)); }
  .node.parked .shape { opacity: 0.45; stroke-dasharray: 4 3; }
  .node.focus-ring .shape { stroke: #ffffff; stroke-width: 3; }
  .node.front .shape { filter: drop-shadow(0 0 10px rgba(240, 182, 75, 0.95)); }

  /* credence bars under outcomes — exist only after commit (scene relight) */
  .node .bartrack, .node .barfill { opacity: 0; }
  svg.revealed .node.outcome .bartrack { opacity: 1; fill: #2a3350; }
  svg.revealed .node.outcome .barfill { opacity: 1; fill: var(--outcome); }
  svg.revealed .node.outcome.front .barfill { fill: var(--good); }

  /* ---- scene edges ---- */
  .edge { fill: none; stroke-linecap: round; }
  .edge.influence { stroke: #7f92c0; }
  .edge.contested { stroke: #c9a2ff; stroke-dasharray: 7 5; }
  .edge.evidence { stroke: #3fd0b6; stroke-dasharray: 2 5; }
  .tether { fill: none; stroke: var(--accent); stroke-dasharray: 4 6; stroke-width: 1.6; opacity: 0.55; }
  .caption { fill: #8d99b8; font-size: 15px; letter-spacing: 3px; }
  .qcaption { fill: #6d7898; font-size: 13px; letter-spacing: 1px; }

  /* ---- right panel ---- */
  #panel {
    flex: 0 0 470px; max-width: 44vw; border-left: 1px solid var(--panel-line);
    background: var(--panel); overflow-y: auto; padding: 14px 16px 40px;
    display: flex; flex-direction: column; gap: 10px;
  }
  #panel h2 { font-size: 1.02rem; margin: 8px 0 4px; }
  #panel h3 {
    font-size: 0.72rem; margin: 14px 0 6px; text-transform: uppercase;
    letter-spacing: 0.09em; color: var(--ink-soft); font-weight: 600;
  }
  .muted { color: var(--ink-soft); font-size: 0.88rem; }
  .small { font-size: 0.8rem; }

  button {
    font: inherit; cursor: pointer; border: 1px solid var(--panel-line);
    background: #1a2338; color: var(--ink); border-radius: 8px; padding: 6px 11px;
  }
  button:hover { border-color: var(--position); }
  button.selected { background: var(--blue); border-color: var(--blue); color: #fff; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; padding: 9px 16px; }
  button.primary[disabled] { opacity: 0.45; cursor: default; }
  button.ghostbtn { background: transparent; border-style: dashed; color: var(--ink-soft); }
  button.linkish { border: none; background: none; color: var(--position); padding: 2px 4px; }

  .chiprow { display: flex; flex-wrap: wrap; gap: 7px; margin: 6px 0; }
  .chip {
    display: inline-block; cursor: pointer; border: 1px solid var(--panel-line);
    border-radius: 14px; padding: 4px 11px; font-size: 0.82rem; background: #1a2338;
  }
  .chip:hover { border-color: var(--position); }
  .chip.selected { background: var(--blue); border-color: var(--blue); color: #fff; }
  .chip.kind-outcome { border-color: #6a5626; }
  .chip.kind-position { border-color: #33507e; }
  .chip.kind-standard { border-color: #5c4d85; }
  .chip.kind-fact { border-color: #2a6a5e; }

  .card {
    background: #10182b; border: 1px solid var(--panel-line); border-radius: 10px;
    padding: 11px 13px;
  }
  .badge {
    display: inline-block; font-size: 0.66rem; letter-spacing: 0.05em; text-transform: uppercase;
    border-radius: 4px; padding: 1px 6px; border: 1px solid var(--panel-line); color: var(--ink-soft);
    margin-right: 5px;
  }
  .badge.standard { border-color: var(--standard); color: var(--standard); }
  .badge.strength { border-color: #2a6a5e; color: var(--fact); }
  .cost { color: var(--ink-soft); font-size: 0.75rem; white-space: nowrap; }

  .sources { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .sources code { background: #1a2338; border: 1px solid var(--panel-line); border-radius: 4px; padding: 0 6px; font-size: 0.73rem; }

  /* one-shot notice, carryback strip, open promises */
  .notice {
    background: #2b2110; border: 1px solid var(--accent); color: var(--accent);
    border-radius: 8px; padding: 8px 12px; font-size: 0.85rem;
  }
  .carryback {
    background: #0f2420; border: 1px solid #2a6a5e; color: #9fe8d8;
    border-radius: 8px; padding: 8px 12px; font-size: 0.85rem;
  }
  .crumbs { display: flex; flex-direction: column; gap: 5px; }
  .crumb {
    cursor: pointer; font-size: 0.8rem; color: var(--promise);
    background: var(--promise-bg); border: 1px dashed var(--promise);
    border-radius: 8px; padding: 5px 10px;
  }

  /* the arrival promise + reveal registers (Interaction §5.5) */
  .promise {
    background: var(--promise-bg); border: 1px solid var(--promise); color: var(--promise);
    border-radius: 8px; padding: 8px 12px; font-size: 0.85rem;
  }
  .reveal-banner {
    background: #0f2416; border: 1px solid var(--good); color: var(--good);
    border-radius: 8px; padding: 8px 12px; font-size: 0.85rem;
  }

  /* guide rail */
  .guide { border-top: 1px solid var(--panel-line); padding-top: 10px; margin-top: 6px; }
  .offer {
    display: block; width: 100%; text-align: left; margin-bottom: 7px;
    background: #101a30; border: 1px solid var(--panel-line); border-radius: 10px; padding: 8px 12px;
  }
  .offer .olabel { color: var(--ink); font-size: 0.88rem; }
  .offer .owhy { color: var(--ink-soft); font-size: 0.78rem; margin-top: 2px; }

  /* payoff furniture */
  .obar { margin: 5px 0 10px; }
  .obar .oname { display: flex; align-items: baseline; gap: 8px; font-size: 0.88rem; }
  .obar .track { height: 10px; background: #2a3350; border-radius: 5px; overflow: hidden; margin-top: 3px; }
  .obar .fill { height: 100%; background: var(--outcome); border-radius: 5px; transition: width 0.5s ease; }
  .obar.top .fill { background: var(--good); }
  .redirect { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .update { border-radius: 8px; padding: 9px 11px; border: 1px solid var(--panel-line); font-size: 0.85rem; }
  .update.ghost { border-style: dashed; color: var(--ink-soft); }
  .update.solid { border-color: var(--position); background: #14203c; }
  .update .uhead { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; color: var(--ink-soft); }
  .update ul { margin: 0; padding-left: 18px; }
  .readings { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .reading { border: 1px solid var(--panel-line); border-radius: 8px; padding: 8px 10px; font-size: 0.84rem; }
  .movement { display: flex; gap: 8px; align-items: baseline; margin: 4px 0; font-size: 0.85rem; }
  .movement .dir { font-weight: 700; }
  .movement .dir.up { color: var(--good); }
  .movement .dir.down { color: var(--bad); }
  .held-yes { color: var(--good); font-size: 0.8rem; }
  .held-no { color: var(--bad); font-size: 0.8rem; }

  /* draft register — unmistakable */
  .draftwrap {
    border: 2px dashed var(--draft-line); border-radius: 10px; background: var(--draft-bg);
    padding: 8px 12px; color: var(--draft-ink); font-size: 0.83rem;
  }
  .draftwrap .stamp {
    display: inline-block; border: 2px solid var(--draft-ink); border-radius: 6px;
    padding: 1px 8px; font-weight: 800; letter-spacing: 0.15em; transform: rotate(-2deg);
    margin-right: 10px; font-size: 0.75rem;
  }

  /* arrival overlay — the belief-first door, over the (structure-only) scene */
  #arrival {
    position: absolute; inset: 0; background: rgba(9, 13, 24, 0.82);
    display: flex; align-items: center; justify-content: center; z-index: 5;
    overflow-y: auto; padding: 24px;
  }
  #arrival[hidden] { display: none; }
  #arrival .door {
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px;
    max-width: 760px; width: 100%; padding: 22px 26px; max-height: 92%; overflow-y: auto;
  }
  #arrival h1 { font-size: 1.3rem; margin: 0 0 4px; }
  #arrival h2 { font-size: 0.95rem; margin: 18px 0 6px; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 0.8rem; color: var(--ink-soft); }
  .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
</style>
</head>
<body>
  <header class="top" id="top"></header>
  <main>
    <div id="scene"></div>
    <div id="panel"></div>
    <div id="arrival" hidden></div>
  </main>
  <script type="module" src="/dist/web/scene.js"></script>
</body>
</html>
