<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>whatpointsto</title>
<link rel="icon" href="data:," />
<style>
  /* ------------------------------------------------------------------------
     Surveyor's field sheet — cold paper, graphite pencil, technical inks.
     Pre-commit the map is PENCILED (outlined shapes, hairline grid);
     commit inks the sheet: fills flood in, credence bars rise (§4.1 —
     the unseal is a visual event). No credence pigment exists before then.
     Registers: promise = pencil (dashed graphite), reveal = mulberry ink,
     carryback = petrol, draft = hatched sheet + rubber stamp.
  ------------------------------------------------------------------------ */
  :root {
    --paper: #eef2f3;        /* the sheet the scene sits on */
    --panel: #fafbfb;        /* reading pane */
    --card: #ffffff;
    --line: #d8dfe2;
    --line-soft: #e6ebed;
    --ink: #1c2a33;
    --ink-soft: #55656e;
    --ink-faint: #8a969d;

    --position: #2e55c4;     /* ultramarine — belief forks */
    --standard: #7442b8;     /* violet — epistemic standards */
    --fact: #0a7285;         /* petrol — evidence */
    --outcome: #9c2e63;      /* mulberry — landings & credence ink */
    --up: #15803d;
    --down: #b42332;

    --pencil: #8a949b;       /* the promise register is penciled in */
    --pencil-bg: #f1f3f4;
    --reveal-ink: #7c2450;
    --reveal-line: #cf9ab5;
    --reveal-bg: #f7edf3;
    --carry-ink: #0b5f63;
    --carry-line: #9ccac2;
    --carry-bg: #e9f4f2;
    --stamp: #a33a34;        /* rubber-stamp red, draft register only */

    --serif: Georgia, Cambria, "Times New Roman", serif;
    --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    --mono: Consolas, "Cascadia Mono", "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); overflow: hidden;
    line-height: 1.5; font-size: 15px;
  }

  button:focus-visible, .chip:focus-visible, .notch:focus-visible {
    outline: 2px solid var(--position); outline-offset: 2px;
  }

  header.top {
    padding: 9px 18px; font-size: 0.85rem; color: var(--ink-soft);
    background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap;
  }
  header.top .brand {
    font-family: var(--mono); color: var(--ink); font-weight: 700; letter-spacing: 0.02em;
  }
  header.top .brand span { color: var(--outcome); }
  header.top nav { margin-left: auto; display: flex; gap: 8px; }

  main { flex: 1; display: flex; min-height: 0; position: relative; }
  #scene { flex: 1; min-width: 0; margin-left: 56px; }
  svg { width: 100%; height: 100%; display: block; cursor: default; }

  /* ---- journey rail — the walk made visible (Interaction §10.3) ----
     A collapsed spine of glyphs; hover/focus widens it as an overlay (the
     scene never reflows under a casual hover). One line per notch is a hard
     cap — full text lives in the frame a notch opens. Emphasis pre-commit is
     the user's own signal echoed back; mulberry joins only post-commit. */
  #rail {
    position: absolute; left: 0; top: 0; bottom: 0; z-index: 4;
    width: 56px; overflow-y: auto; overflow-x: hidden;
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 8px 7px 12px; display: flex; flex-direction: column; gap: 3px;
    transition: width 0.18s ease;
    scrollbar-width: none;
  }
  #rail[hidden] { display: none; }
  #rail:hover, #rail:focus-within {
    width: 308px; box-shadow: 8px 0 22px rgba(28, 42, 51, 0.1);
    scrollbar-width: thin;
  }
  /* the rail scrolls; it never squeezes its notches (flex would zero them out) */
  #rail > * { flex-shrink: 0; }
  #rail .rlabel, #rail .railcap {
    opacity: 0; white-space: nowrap; overflow: hidden; transition: opacity 0.15s ease;
  }
  #rail:hover .rlabel, #rail:focus-within .rlabel,
  #rail:hover .railcap, #rail:focus-within .railcap { opacity: 1; }
  .railcap {
    font-family: var(--mono); font-size: 0.62rem; text-transform: uppercase;
    letter-spacing: 0.13em; color: var(--ink-faint); margin: 7px 3px 2px;
  }
  .railsep { border-top: 1px solid var(--line-soft); margin: 7px 2px 4px; }
  .notch {
    display: flex; align-items: center; gap: 10px; width: 100%;
    border: 1px solid transparent; background: transparent; border-radius: 8px;
    padding: 4px 6px; font-size: 0.78rem; color: var(--ink); text-align: left;
    line-height: 1.35;
  }
  button.notch { cursor: pointer; }
  button.notch:hover { background: var(--pencil-bg); border-color: var(--line); }
  .notch .glyph {
    flex: 0 0 26px; display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); font-size: 0.82rem;
  }
  .notch.inert { color: var(--ink-soft); }
  .notch.promise-n { color: var(--ink-soft); }
  .notch.promise-n .glyph { color: var(--pencil); }

  /* coverage dots — answered fills with ink; emphasis echoes the user's own signal */
  .dotmark {
    display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--position); background: var(--card);
  }
  .dotmark.answered { background: var(--position); }
  .dotmark.waver { border-style: dashed; border-color: var(--ink-soft); }
  .dotmark.flagged { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--ink-soft); }
  .dotmark.carrying {
    border-color: var(--outcome);
    box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--reveal-line);
  }

  .railfoot {
    margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line-soft);
    display: flex; flex-direction: column; gap: 6px;
    position: sticky; bottom: 0; background: var(--panel);
  }
  .railfoot .notch.primary {
    background: var(--position); border-color: var(--position); color: #fff;
    padding: 6px 8px; font-weight: 600;
  }
  .railfoot .notch.primary .glyph { color: #fff; }
  .railfoot .progress { font-size: 0.72rem; color: var(--ink-soft); padding: 0 6px; letter-spacing: 2px; }
  .railfoot .revealmark { color: var(--outcome); }

  /* ---- register banner — the session's own voice (notice · promise/reveal · draft) ---- */
  #register {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 6px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #register[hidden] { display: none; }
  #register .notice, #register .promise, #register .reveal-banner {
    flex: 1 1 260px; padding: 4px 10px; font-size: 0.8rem;
  }
  #register .draftline { color: #4a5258; font-size: 0.78rem; }
  #register .draftline .stamp {
    display: inline-block; border: 2px solid var(--stamp); border-radius: 6px;
    padding: 0 6px; font-weight: 800; letter-spacing: 0.15em; transform: rotate(-2deg);
    margin-right: 7px; font-size: 0.68rem; color: var(--stamp);
    font-family: var(--mono); background: rgba(255, 255, 255, 0.65);
  }

  /* ---- scene nodes: penciled until the commit inks them ---- */
  .node { cursor: pointer; }
  .node .shape { fill: var(--card); stroke-width: 2; }
  .node.outcome .shape { stroke: var(--outcome); }
  .node.position .shape { stroke: var(--position); }
  .node.position.standard .shape { stroke: var(--standard); }
  .node.fact .shape { stroke: var(--fact); }
  .node .name { fill: #35444d; font-size: 12px; pointer-events: none; }

  svg.revealed .node .shape { stroke-width: 1.5; }
  svg.revealed .node.outcome .shape { fill: var(--outcome); stroke: #6d1f45; }
  svg.revealed .node.position .shape { fill: var(--position); stroke: #1e3a8c; }
  svg.revealed .node.position.standard .shape { fill: var(--standard); stroke: #532e87; }
  svg.revealed .node.fact .shape { fill: var(--fact); stroke: #06515f; }

  .node.answered .shape { stroke: var(--up); stroke-width: 3.5; }
  .node.live .shape { filter: drop-shadow(0 0 6px rgba(10, 114, 133, 0.65)); }
  .node.parked .shape { opacity: 0.45; stroke-dasharray: 4 3; }
  .node.focus-ring .shape { stroke: var(--ink); stroke-width: 3.5; }
  .node.front .shape { filter: drop-shadow(0 0 9px rgba(156, 46, 99, 0.6)); }
  /* state rings must out-rank the inked fills' stroke rules */
  svg.revealed .node.answered .shape { stroke: var(--up); stroke-width: 3.5; }
  svg.revealed .node.focus-ring .shape { stroke: var(--ink); stroke-width: 3.5; }

  /* credence bars under outcomes — exist only after commit (the inking) */
  .node .bartrack, .node .barfill { opacity: 0; }
  svg.revealed .node.outcome .bartrack { opacity: 1; fill: #dde4e8; }
  svg.revealed .node.outcome .barfill { opacity: 1; fill: var(--outcome); }
  svg.revealed .node.outcome.front .barfill { fill: var(--up); }

  /* ---- scene edges: pencil grid; focus raises their weight ---- */
  .edge { fill: none; stroke-linecap: round; }
  .edge.influence { stroke: #5a7188; }
  .edge.contested { stroke: var(--standard); stroke-dasharray: 7 5; }
  .edge.evidence { stroke: var(--fact); stroke-dasharray: 2 5; }
  .tether { fill: none; stroke: var(--pencil); stroke-dasharray: 4 6; stroke-width: 1.6; opacity: 0.8; }
  .caption { fill: #6f7e87; font-size: 13px; letter-spacing: 3px; font-family: var(--mono); }
  .qcaption { fill: #46565f; font-size: 15px; font-family: var(--serif); font-style: italic; letter-spacing: 0.4px; }

  /* ---- right panel ---- */
  #panel {
    flex: 0 0 360px; max-width: 40vw; border-left: 1px solid var(--line);
    background: var(--panel); overflow-y: auto; padding: 14px 16px 40px;
    display: flex; flex-direction: column; gap: 10px;
  }
  #panel h2 {
    font-family: var(--serif); font-weight: 400; font-size: 1.18rem;
    line-height: 1.38; margin: 8px 0 4px;
  }
  #panel h3 {
    font-family: var(--mono); font-size: 0.68rem; margin: 15px 0 6px;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--ink-soft); font-weight: 600;
  }
  .muted { color: var(--ink-soft); font-size: 0.88rem; }
  .small { font-size: 0.8rem; }

  button {
    font: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 11px;
    text-align: left;
  }
  button:hover { border-color: var(--position); }
  button.selected { background: var(--position); border-color: var(--position); color: #fff; }
  button.primary {
    background: var(--position); border-color: var(--position); color: #fff;
    font-weight: 600; padding: 9px 16px;
  }
  button.primary[disabled] { opacity: 0.45; cursor: default; }
  button.ghostbtn { background: transparent; border-style: dashed; color: var(--ink-soft); }
  button.linkish { border: none; background: none; color: var(--position); padding: 2px 4px; }

  /* chips wrap — nothing on this surface hides behind an ellipsis */
  .chiprow { display: flex; flex-wrap: wrap; gap: 7px; margin: 6px 0; }
  .chip {
    display: inline-block; cursor: pointer; border: 1px solid var(--line);
    border-left-width: 3px; border-radius: 9px; padding: 4px 11px;
    font-size: 0.82rem; line-height: 1.4; background: var(--card);
    white-space: normal; overflow-wrap: anywhere; text-align: left; max-width: 100%;
  }
  .chip:hover { border-color: var(--position); }
  .chip.selected { background: var(--position); border-color: var(--position); color: #fff; }
  .chip.block { display: block; }
  .chip.kind-outcome { border-left-color: var(--outcome); }
  .chip.kind-position { border-left-color: var(--position); }
  .chip.kind-standard { border-left-color: var(--standard); }
  .chip.kind-fact { border-left-color: var(--fact); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px;
  }
  .badge {
    display: inline-block; font-family: var(--mono); font-size: 0.64rem;
    letter-spacing: 0.07em; text-transform: uppercase;
    border-radius: 4px; padding: 1px 6px; border: 1px solid var(--line);
    color: var(--ink-soft); margin-right: 5px; background: var(--card);
  }
  .badge.standard { border-color: var(--standard); color: var(--standard); }
  .badge.strength { border-color: var(--fact); color: var(--fact); }
  .cost { color: var(--ink-soft); font-size: 0.75rem; white-space: nowrap; }

  .sources { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .sources code {
    font-family: var(--mono); background: var(--pencil-bg); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 6px; font-size: 0.73rem;
  }

  /* one-shot notice: a firm graphite slip laid on the sheet */
  .notice {
    background: var(--ink); border: 1px solid var(--ink); color: var(--paper);
    border-radius: 8px; padding: 8px 12px; font-size: 0.85rem;
  }
  .carryback {
    background: var(--carry-bg); border: 1px solid var(--carry-line); color: var(--carry-ink);
    border-radius: 8px; padding: 8px 12px; font-size: 0.85rem;
  }
  /* the arrival promise (penciled in) + reveal (inked) — Interaction §5.5 */
  .promise {
    background: var(--pencil-bg); border: 1px dashed var(--pencil); color: var(--ink-soft);
    border-radius: 8px; padding: 8px 12px; font-size: 0.85rem;
  }
  .reveal-banner {
    background: var(--reveal-bg); border: 1px solid var(--reveal-line); color: var(--reveal-ink);
    border-radius: 8px; padding: 8px 12px; font-size: 0.85rem;
  }

  /* payoff furniture */
  .obar { margin: 5px 0 10px; }
  .obar .oname { display: flex; align-items: baseline; gap: 8px; font-size: 0.88rem; }
  .obar .track { height: 10px; background: #e2e8eb; border-radius: 5px; overflow: hidden; margin-top: 3px; }
  .obar .fill { height: 100%; background: var(--outcome); border-radius: 5px; transition: width 0.5s ease; }
  .obar.top .fill { background: var(--up); }
  .redirect { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .update { border-radius: 8px; padding: 9px 11px; border: 1px solid var(--line); font-size: 0.85rem; background: var(--card); }
  .update.ghost { border-style: dashed; color: var(--ink-soft); background: transparent; }
  .update.solid { border-color: var(--position); background: #eef2fc; }
  .update .uhead {
    font-family: var(--mono); font-size: 0.66rem; text-transform: uppercase;
    letter-spacing: 0.09em; margin-bottom: 5px; color: var(--ink-soft);
  }
  .update ul { margin: 0; padding-left: 18px; }
  .readings { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .reading { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 0.84rem; background: var(--card); }
  .movement { display: flex; gap: 8px; align-items: baseline; margin: 4px 0; font-size: 0.85rem; }
  .movement .dir { font-weight: 700; }
  .movement .dir.up { color: var(--up); }
  .movement .dir.down { color: var(--down); }
  .held-yes { color: var(--up); font-size: 0.8rem; }
  .held-no { color: var(--down); font-size: 0.8rem; }

  /* draft register — an unfinished pencil sheet wearing a rubber stamp */
  .draftwrap {
    border: 2px dashed var(--pencil); border-radius: 10px;
    background: repeating-linear-gradient(45deg, #f4f5f4 0 7px, #ececea 7px 8px);
    padding: 8px 12px; color: #4a5258; font-size: 0.83rem;
  }
  .draftwrap .stamp {
    display: inline-block; border: 2px solid var(--stamp); border-radius: 6px;
    padding: 1px 8px; font-weight: 800; letter-spacing: 0.15em; transform: rotate(-2deg);
    margin-right: 10px; font-size: 0.75rem; color: var(--stamp);
    font-family: var(--mono); background: rgba(255, 255, 255, 0.65);
  }

  /* arrival overlay — the belief-first door, over the (structure-only) sheet */
  #arrival {
    position: absolute; inset: 0; background: rgba(233, 238, 240, 0.88);
    display: flex; align-items: center; justify-content: center; z-index: 5;
    overflow-y: auto; padding: 24px;
  }
  #arrival[hidden] { display: none; }
  #arrival .door {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 18px 50px rgba(28, 42, 51, 0.14);
    max-width: 760px; width: 100%; padding: 24px 28px; max-height: 92%; overflow-y: auto;
  }
  #arrival h1 { font-family: var(--serif); font-weight: 400; font-size: 1.55rem; margin: 0 0 4px; }
  #arrival h2 { font-family: var(--serif); font-weight: 400; font-size: 1.06rem; margin: 20px 0 6px; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 0.8rem; color: var(--ink-soft); }
  .legend .dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px;
    background: var(--card); border: 2px solid currentColor;
  }
  .legend .dot.round { border-radius: 50%; }
  .legend .dot.diamond { transform: rotate(45deg); border-radius: 1px; }

  @media (prefers-reduced-motion: reduce) {
    .obar .fill { transition: none; }
    #rail, #rail .rlabel, #rail .railcap { transition: none; }
  }
</style>
</head>
<body>
  <header class="top" id="top"></header>
  <div id="register" hidden></div>
  <main>
    <aside id="rail" hidden></aside>
    <div id="scene"></div>
    <div id="panel"></div>
    <div id="arrival" hidden></div>
  </main>
  <script type="module" src="./dist/web/scene.js"></script>
</body>
</html>
